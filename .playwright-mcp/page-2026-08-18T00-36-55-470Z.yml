      - generic [ref=e213]:
        - generic [ref=e214]:
          - text: Before you ask
          - heading "Common questions" [level=2] [ref=e215]
        - generic [ref=e216]:
          - generic [ref=e217]:
            - term [ref=e218]: Do I have to switch POS systems?
            - definition [ref=e219]: No. Rail reads from the POS you already run. There is a direct integration for Clover, Toast and 2TouchPOS, and for anything else you can import the CSV or text exports your system already produces.
          - generic [ref=e220]:
            - term [ref=e221]: How does Rail get my sales data?
            - definition [ref=e222]: Three ways, depending on your setup. A small agent installed on the POS machine syncs automatically every few minutes; a nightly email report can be ingested for you; or you upload the export by hand whenever you want.
          - generic [ref=e223]:
            - term [ref=e224]: How long does setup take?
            - definition [ref=e225]: Connecting a POS and importing your existing inventory usually takes under an hour. You can try the demo immediately without setting anything up.
          - generic [ref=e226]:
            - term [ref=e227]: Can I move my existing inventory across?
            - definition [ref=e228]: Yes. Import a spreadsheet, a supplier invoice, or a POS item export and Rail will match items to what is already there rather than creating duplicates. We will do the first import with you.
          - generic [ref=e229]:
            - term [ref=e230]: Who can see my bar’s data?
            - definition [ref=e231]: Only people you invite to your bar. Each bar’s data is isolated from every other. Bank details for direct deposit are encrypted before they are stored, and only the last four digits are ever shown back.
          - generic [ref=e232]:
            - term [ref=e233]: Does Rail use AI on my data?
            - definition [ref=e234]: Only to read files you import that are not in a recognised format. In that case the file’s text — which can include employee names, hours and tips — is sent to a third-party model to extract the figures. It is never used to train a model. Our privacy policy sets out exactly what is sent and when.
          - generic [ref=e235]:
            - term [ref=e236]: What does it cost?
            - definition [ref=e237]: Pricing depends on the size of your operation, so there is no public price list. Request a demo and we will quote you on the call — no obligation and no long-term contract.
          - generic [ref=e238]:
            - term [ref=e239]: What happens to my data if I stop using Rail?
            - definition [ref=e240]: You can export it at any time, and we delete your account data within 30 days of closure except where tax rules require us to retain records.
